# A generic, single database configuration for StreamGuard.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names; The default value is %(rev)s_%(slug)s
file_template = %(rev)s_%(slug)s

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file as well as the filename.
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
sourceless = false

# Version location specification; This defaults to alembic/versions.
version_locations = alembic/versions

# Version path separator; uses os.pathsep
version_path_separator = os

# Set to 'true' to search source files recursively in each "version_locations" directory
recursive_version_locations = false

# The output encoding used when revisions are written from script.py.mako
output_encoding = utf-8

# Default SQLAlchemy URL matching app.config DATABASE_URL pattern
# Note: env.py dynamically overrides this with app.config.get_settings().DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://streamguard:streamguard_secret@localhost:5432/streamguard


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
